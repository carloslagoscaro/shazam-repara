name: Compilar APK ShazamRepara
 
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
 
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
 
      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon
 
      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk "salida/shazam-repara-build-${{ github.run_number }}.apk"
 
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: shazam-repara-apk
          path: salida/*.apk
          if-no-files-found: error
 
      - name: Publicar APK como Release (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: APK de debug compilada automáticamente desde el commit ${{ github.sha }}.
          files: salida/*.apk
          fail_on_unmatched_files: true
